name: Python Package

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pipx
        run: sudo apt update && sudo apt install pipx && pipx ensurepath

      - name: Install Black
        run: |
          python -m pip install --upgrade pip
          python -m pip install black

      - name: Check formatting
        run: black --check --diff --include='.*\.py' .

  unittest:
    name: Unittest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.15", "3.14", "3.13", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: Run tests
        run: tox -e ${{ matrix.python-version }}
